[project]
name = "running-annalysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "mediapipe>=1.2.0",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[dependency-groups]
dev = [
    "hatchling>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/running_analysis"]
